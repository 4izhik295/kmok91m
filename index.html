<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messenger Pro</title>
<style>
:root {
  --primary: #0088cc;
  --bg-gradient: linear-gradient(135deg, #1a1c20 0%, #0f0f10 100%);
  --glass: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(255, 255, 255, 0.1);
  --text-main: #ffffff;
  --text-dim: #a0a0a0;
}
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg-gradient);
  color: var(--text-main);
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
#auth {
  background: var(--glass);
  backdrop-filter: blur(10px);
  padding: 40px;
  border-radius: 20px;
  border: 1px solid var(--glass-border);
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  display: flex;
  flex-direction: column;
  gap: 15px;
  width: 320px;
}
#auth h2 { margin: 0 0 10px 0; text-align: center; }
#auth input {
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--glass-border);
  padding: 12px;
  border-radius: 10px;
  color: white;
  outline: none;
}
.file-upload-btn {
  background: rgba(255,255,255,0.1);
  border: 1px dashed var(--glass-border);
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  cursor: pointer;
  color: var(--text-dim);
  font-size: 14px;
}
#auth button {
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}
#auth button:first-of-type { background: var(--primary); color: white; }
#auth button:last-of-type { background: transparent; color: var(--text-dim); border: 1px solid var(--glass-border); }
#auth button:hover { opacity: 0.8; transform: translateY(-2px); }

.app {
  display: flex;
  width: 95vw;
  height: 90vh;
  background: var(--glass);
  backdrop-filter: blur(15px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 25px 50px rgba(0,0,0,0.4);
}
.sidebar {
  width: 320px;
  background: rgba(0, 0, 0, 0.2);
  border-right: 1px solid var(--glass-border);
  display: flex;
  flex-direction: column;
}
.topbar {
  padding: 20px;
  font-size: 1.2rem;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--glass-border);
}
.topbar button {
  background: var(--primary);
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  color: white;
  cursor: pointer;
  font-size: 16px;
  font-weight: bold;
}
.chat-item {
  padding: 12px 20px;
  margin: 5px 10px;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.2s;
  display: flex;
  align-items: center;
  gap: 12px;
}
.chat-item:hover { background: var(--glass); }
.chat-item.active { background: rgba(0, 136, 204, 0.2); border: 1px solid rgba(0, 136, 204, 0.4); }
.user-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  object-fit: cover;
  background: #333;
}
.chat-item-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.chat-item-tag {
  font-size: 11px;
  color: var(--text-dim);
}

.chat {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: rgba(0,0,0,0.1);
}
.chat-header {
  padding: 15px 20px;
  background: rgba(0, 0, 0, 0.15);
  border-bottom: 1px solid var(--glass-border);
  display: flex;
  align-items: center;
  gap: 12px;
}
.chat-header-info {
  display: flex;
  flex-direction: column;
}
.chat-header-name {
  font-weight: bold;
  font-size: 15px;
}
.chat-header-tag {
  font-size: 12px;
  color: var(--text-dim);
}

.messages {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.msg {
  padding: 12px 16px;
  border-radius: 18px;
  max-width: 75%;
  font-size: 14px;
  line-height: 1.4;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.msg-meta {
  font-size: 11px;
  color: rgba(255,255,255,0.5);
  font-weight: bold;
}
.other .msg-meta {
  color: var(--primary);
}
.msg-img {
  max-width: 280px;
  max-height: 200px;
  border-radius: 10px;
  margin-top: 5px;
  object-fit: cover;
  cursor: pointer;
}
.me {
  background: var(--primary);
  color: white;
  align-self: flex-end;
  border-bottom-right-radius: 4px;
}
.other {
  background: var(--glass);
  color: var(--text-main);
  align-self: flex-start;
  border-bottom-left-radius: 4px;
  border: 1px solid var(--glass-border);
}
.input-area {
  padding: 20px;
  background: rgba(0,0,0,0.2);
  display: flex;
  gap: 10px;
  align-items: center;
}
.input-area input {
  flex: 1;
  background: var(--glass);
  border: 1px solid var(--glass-border);
  padding: 12px 18px;
  border-radius: 25px;
  color: white;
  outline: none;
}
.input-area button {
  background: var(--primary);
  border: none;
  width: 45px;
  height: 45px;
  border-radius: 50%;
  color: white;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.attach-btn {
  background: rgba(255,255,255,0.05) !important;
  border: 1px solid var(--glass-border) !important;
  font-size: 18px !important;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
@media (max-width: 768px) {
  .app { width: 100vw; height: 100vh; border-radius: 0; }
  .sidebar { width: 100%; }
}
</style>
</head>
<body>

<div id="auth">
  <h2>Вход / Регистрация</h2>
  <input id="username" placeholder="Имя (Ник)">
  <input id="usertag" placeholder="Уникальный юзернейм (например, ivan)">
  <input id="password" type="password" placeholder="Пароль">
  
  <label class="file-upload-btn" id="avatar-label">
    👤 Выбрать аватарку
    <input id="avatar-file" type="file" accept="image/*" style="display:none;" onchange="document.getElementById('avatar-label').innerText = '✅ Фото выбрано'">
  </label>

  <button onclick="register()">Регистрация</button>
  <button onclick="login()">Войти</button>
</div>

<div class="app" id="app" style="display:none;">
  <div class="sidebar">
    <div class="topbar">
      <b>Чаты</b>
      <button onclick="createChatByTag()">+</button>
    </div>
    <div id="users"></div>
  </div>
  <div class="chat">
    <div class="chat-header" id="chat-header" style="display: none;">
      <img class="user-avatar" id="header-avatar" src="https://imgur.com">
      <div class="chat-header-info">
        <span class="chat-header-name" id="header-name">Выберите чат</span>
        <span class="chat-header-tag" id="header-tag"></span>
      </div>
    </div>
    
    <div class="messages" id="messages"></div>
    <div class="input-area" id="input-container" style="display: none;">
      <label class="input-area button attach-btn">
        📎
        <input id="chat-file" type="file" accept="image/*" style="display:none;" onchange="sendImage()">
      </label>
      <input id="text" placeholder="Сообщение...">
      <button onclick="send()">➤</button>
    </div>
  </div>
</div>

<!-- Правильное подключение библиотек через официальный CDN без импортов -->
<script src="https://www.gstatic.com/firebasejs/9.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.12.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCp6du4xz9oe0YMhDIE_e1T1nNblVCL4IY",
  authDomain: "messengerlol-3bedb.firebaseapp.com",
  databaseURL: "https://messengerlol-3bedb-default-rtdb.firebaseio.com",
  projectId: "messengerlol-3bedb",
  storageBucket: "messengerlol-3bedb.appspot.com",
  appId: "1:232766065545:web:8651a24d86bfa332ee1d4b"
};

const app = firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const IMGBB_API_KEY = "99c30768cb5870e44ad25564ed6509bb"; 

let currentUser = null;
let currentChat = null;

async function uploadToImgbb(file) {
  if (!file) return null;
  const formData = new FormData();
  formData.append('image', file);
  try {
    const response = await fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_API_KEY, {
      method: "POST",
      body: formData
    });
    const result = await response.json();
    return result.success ? result.data.url : null;
  } catch (e) {
    console.error(e);
    return null;
  }
}

window.register = async () => {
  const nick = document.getElementById("username").value.trim();
  const tag = document.getElementById("usertag").value.trim().toLowerCase(); 
  const pass = document.getElementById("password").value;
  const fileInput = document.getElementById("avatar-file");
  
  if(!nick || !tag || !pass) return alert("Заполни все поля");
  if(tag.includes(" ") || tag.length < 3) return alert("Юзернейм должен быть без пробелов и длиннее 2 символов");
  
  const snap = await db.ref("users").get();
  let isTaken = false;
  if(snap.exists()) {
    snap.forEach(u => {
      if(u.val().tag === tag) isTaken = true;
    });
  }
  if(isTaken) return alert("Этот юзернейм уже занят! Выберите другой.");

  let avatarUrl = "https://i.imgur.com/DTFJbpS.jpeg";
  
  if (fileInput && fileInput.files && fileInput.files[0]) {
    document.getElementById("avatar-label").innerText = "⏳ Загрузка аватарки...";
    const uploadedUrl = await uploadToImgbb(fileInput.files[0]);
    if (uploadedUrl) avatarUrl = uploadedUrl;
  }

  await auth.signInAnonymously();
  const uid = crypto.randomUUID();
  await db.ref("users/" + uid).set({
    nick: nick,
    tag: tag,
    pass: pass,
    avatar: avatarUrl
  });
  
  alert("Аккаунт создан! Теперь войдите");
  document.getElementById("avatar-label").innerText = "👤 Выбрать аватарку";
  fileInput.value = "";
};

window.login = async () => {
  const tag = usertag.value.trim().toLowerCase();
  const pass = password.value;
  if(!tag || !pass) return alert("Заполни Юзернейм и Пароль");
  
  await firebase.auth().signInAnonymously();
  const snap = await db.ref("users").get();
  let found = null;
  
  if(snap.exists()) {
    snap.forEach(u=>{
      const d = u.val();
      if (d.tag === tag && d.pass === pass) found = { uid: u.key, ...d };
    });
  }

  if (!found) return alert("Неверный юзернейм или пароль");
  currentUser = { uid: found.uid, nick: found.nick, tag: found.tag, avatar: found.avatar };

  const statusRef = db.ref("status/" + currentUser.uid);
  statusRef.set({ online: true, lastSeen: Date.now() });
  statusRef.onDisconnect().set({ online: false, lastSeen: Date.now() });

  document.getElementById("auth").style.display = "none";
  document.getElementById("app").style.display = "flex";

  loadMyChats();
};

window.createChatByTag = async () => {
  const targetTag = prompt("Введите юзернейм (tag) пользователя, с которым хотите начать чат:").trim().toLowerCase();
  if (!targetTag) return;
  if (targetTag === currentUser.tag) return alert("Нельзя создать чат с самим собой");

  const snap = await db.ref("users").get();
  let targetUser = null;

  snap.forEach(u => {
    if (u.val().tag === targetTag) {
      targetUser = { uid: u.key, ...u.val() };
    }
  });

  if (!targetUser) return alert("Пользователь с таким юзернеймом не найден!");

  await db.ref("user_chats/" + currentUser.uid + "/" + targetUser.uid).set(true);
  await db.ref("user_chats/" + targetUser.uid + "/" + currentUser.uid).set(true);

  openPrivate(targetUser.uid);
};

function loadMyChats() {
  db.ref("user_chats/" + currentUser.uid).on("value", async (snap) => {
    users.innerHTML = "";
    if (!snap.exists()) return;

    const usersSnap = await db.ref("users").get();
    const allUsers = usersSnap.val() || {};

    snap.forEach(chatNode => {
      const targetUid = chatNode.key;
      const uData = allUsers[targetUid];
      if (!uData) return;

      const div = document.createElement("div");
      div.className = "chat-item" + (currentChat && currentChat.id === targetUid ? " active" : "");
      div.id = "item-" + targetUid;

      const img = document.createElement("img");
      img.className = "user-avatar";
      img.src = uData.avatar || "https://imgur.com";

      const infoDiv = document.createElement("div");
      infoDiv.className = "chat-item-info";

      const nameSpan = document.createElement("span");
      nameSpan.style.fontWeight = "bold";
      nameSpan.textContent = uData.nick;

      const tagSpan = document.createElement("span");
      tagSpan.className = "chat-item-tag";
      tagSpan.textContent = "@" + uData.tag;

      infoDiv.appendChild(nameSpan);
      infoDiv.appendChild(tagSpan);
      div.appendChild(img);
      div.appendChild(infoDiv);

      div.onclick = () => openPrivate(targetUid);
      users.appendChild(div);
    });
  });
}

function chatId(a, b) { return a < b ? a + "_" + b : b + "_" + a; }

async function openPrivate(uid) {
  currentChat = { type: "private", id: uid };
  document.querySelectorAll(".chat-item").forEach(el => el.classList.remove("active"));
  
  const activeItem = document.getElementById("item-" + uid);
  if (activeItem) activeItem.classList.add("active");

  const userSnap = await db.ref("users/" + uid).get();
  if (userSnap.exists()) {
    const d = userSnap.val();
    document.getElementById("header-avatar").src = d.avatar;
    document.getElementById("header-name").textContent = d.nick;
    document.getElementById("header-tag").textContent = "@" + d.tag;
    document.getElementById("chat-header").style.display = "flex";
    document.getElementById("input-container").style.display = "flex";
  }

  messages.innerHTML = "";
  db.ref("messages/" + chatId(currentUser.uid, uid)).on("value", snap => {
    messages.innerHTML = "";
    snap.forEach(c => render(c.val(), c.key));
    messages.scrollTop = messages.scrollHeight;
  });
}

function render(msg, key) {
  const div = document.createElement("div");
  const isMe = msg.senderId === currentUser.uid;
  div.className = "msg " + (isMe ? "me" : "other");

  const meta = document.createElement("div");
  meta.className = "msg-meta";
  meta.textContent = msg.senderNick;
  div.appendChild(meta);

  if (msg.type === "image") {
    const img = document.createElement("img");
    img.className = "msg-img";
    img.src = msg.content;
    img.onclick = () => window.open(msg.content, "_blank");
    div.appendChild(img);
  } else {
    const textNode = document.createElement("span");
    textNode.textContent = msg.content;
    div.appendChild(textNode);
  }

  messages.appendChild(div);
}

window.send = () => {
  const input = document.getElementById("text");
  if (!input.value.trim() || !currentChat) return;

  db.ref("user_chats/" + currentUser.uid + "/" + currentChat.id).set(true);
  db.ref("user_chats/" + currentChat.id + "/" + currentUser.uid).set(true);

  const msgRef = db.ref("messages/" + chatId(currentUser.uid, currentChat.id));
  const newMsgRef = msgRef.push();
  newMsgRef.set({
    senderId: currentUser.uid,
    senderNick: currentUser.nick,
    content: input.value,
    type: "text",
    timestamp: Date.now()
  });
  input.value = "";
};

window.sendImage = async () => {
  const fileInput = document.getElementById("chat-file");
  if (!fileInput || !fileInput.files || !fileInput.files[0] || !currentChat) return;
  
  const file = fileInput.files[0]; // Четко берем первый выбранный файл
  fileInput.value = ""; 
  
  const tempId = db.ref().push().key;
  render({ senderId: currentUser.uid, senderNick: currentUser.nick, content: "⏳ Отправка изображения...", type: "text" }, tempId);
  messages.scrollTop = messages.scrollHeight;

  const imageUrl = await uploadToImgbb(file);
  
  if (imageUrl) {
    db.ref("user_chats/" + currentUser.uid + "/" + currentChat.id).set(true);
    db.ref("user_chats/" + currentChat.id + "/" + currentUser.uid).set(true);
    
    const msgRef = db.ref("messages/" + chatId(currentUser.uid, currentChat.id));
    const newMsgRef = msgRef.push();
    newMsgRef.set({
      senderId: currentUser.uid,
      senderNick: currentUser.nick,
      content: imageUrl,
      type: "image",
      timestamp: Date.now()
    });
  } else {
    alert("Не удалось загрузить картинку");
  }
};
</script>
</body>
</html>
